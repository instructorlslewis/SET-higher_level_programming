<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Fruit Demonstration</title>
    <script src="fruit-demo.js" defer></script>
</head>
<body>
    <h1>Simple Fruit Demonstration</h1>

    <label for="fruit-name">Fruit name:</label>
    <input id="fruit-name" type="text" placeholder="Apple">

    <label for="fruit-color">Fruit color:</label>
    <input id="fruit-color" type="text" placeholder="Red">

    <button id="show-button" type="button">Show Fruit</button>

    <p id="output">Your fruit description will appear here.</p>
</body>
</html>
